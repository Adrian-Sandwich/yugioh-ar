<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yu-Gi-Oh! · Catálogo y artes</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10151e;color:#eef3fb;font:16px system-ui}header,main{max-width:1400px;margin:auto;padding:24px}header{border-bottom:1px solid #344053}h1{margin:0 0 10px}p{color:#bcc8dc}button,input,select,textarea{font:inherit;padding:9px;border-radius:8px;border:1px solid #47556d;background:#202b3d;color:inherit}button{cursor:pointer}button:hover{background:#34506a}button:disabled{opacity:.4;cursor:default}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:16px;margin:22px 0}.tile{border:1px solid #35435a;border-radius:12px;padding:12px;background:#192232}.tile img{width:100%;height:230px;object-fit:contain;background:repeating-conic-gradient(#263244 0% 25%,#1c2533 0% 50%) 0/20px 20px}.tile h3{font-size:15px;overflow-wrap:anywhere}.tile button{margin:4px 3px 0 0}.tag{font-size:12px;color:#8ee6c3}.muted{color:#adb9cf;font-size:13px}.detail{border:1px solid #40516d;border-radius:12px;padding:20px;margin-top:20px}#message{min-height:25px;color:#a4edcc}dialog{width:min(650px,95vw);background:#172134;color:white;border:1px solid #536681;border-radius:12px}dialog label{display:block;margin:12px 0}dialog input,dialog select,dialog textarea{width:100%}dialog img{height:180px;max-width:100%;object-fit:contain}.danger{color:#ffb6b6}a{color:#8ee6c3}summary{cursor:pointer}#detail .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
</style>
<nav style="max-width:1400px;margin:auto;padding:16px 24px"><a href="http://127.0.0.1:8769">Consultar nombres, passcodes y códigos de set</a></nav>
<header><h1>Catálogo y artes</h1><p>Revisa qué imágenes representan la misma carta. Conserva sus distintos artes, idiomas y acabados.</p><div id="summary">Cargando catálogo…</div></header>
<main><div class="bar"><input id="query" placeholder="Buscar en español, inglés, alemán, francés o portugués" aria-label="Buscar cartas"><button id="search">Buscar</button><button id="pending">Revisar pendientes</button><button id="showPilot">Ver piloto</button><a href="http://127.0.0.1:8765" target="_blank" rel="noopener">Abrir cámara</a></div>
<p><a href="/capture">Añadir y etiquetar capturas reales</a> · <a href="http://127.0.0.1:8767" target="_blank" rel="noopener">Ver AR con una captura guardada</a></p><p id="message" role="status"></p><div class="bar"><button id="prev">Anterior</button><span id="page"></span><button id="next">Siguiente</button><button id="savePilot">Guardar selección del piloto</button><button id="clearPilot">Vaciar selección</button><span id="selected"></span></div><div id="grid" class="grid"></div><section id="detail" hidden class="detail"></section></main>
<dialog id="review"><form id="reviewForm"><h2>Revisar referencia</h2><img id="reviewImage" alt="Referencia a revisar"><p id="reviewName"></p><label>Buscar identidad<input id="identityQuery" placeholder="Nombre de la carta"></label><button type="button" id="identitySearch">Buscar coincidencias</button><label>Identidad<select id="identity" required></select></label><label>Etiqueta de arte (opcional)<input id="art" maxlength="150" placeholder="Por ejemplo: ilustración clásica"></label><label>Idioma impreso<select id="language"><option value="">Sin verificar</option><option value="es">Español</option><option value="en">Inglés</option><option value="de">Alemán</option><option value="fr">Francés</option><option value="pt">Portugués</option></select></label><label>Rareza/acabado (opcional)<input id="rarity" maxlength="150" placeholder="Solo si puedes verificarlo"></label><label>Nota<textarea id="note" maxlength="2000"></textarea></label><p id="reviewError" class="danger" role="alert"></p><button type="submit">Aprobar asociación</button><button type="button" id="reject">Descartar referencia</button><button type="button" id="reset">Deshacer revisión</button><button type="button" id="cancel">Cancelar</button></form></dialog>
<script>
const $=s=>document.querySelector(s);let token='',mode='cards',page=0,total=0,selected=new Set(),activeCard=null,activeRef=null;
const labels={linked:'Enlazada por ID y nombre',proposed:'Propuesta · revisar',unresolved:'Sin identidad',approved:'Aprobada',rejected:'Descartada'};
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function asset(id,thumb=false){return '/asset?id='+encodeURIComponent(id)+(thumb?'&thumb=1':'')}
async function api(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(body)}:{});const data=await r.json();if(!r.ok)throw Error(data.error||'No se pudo completar');return data}
function message(t){$('#message').style.color='';$('#message').textContent=t}
// Passive hints (end of a page load) never replace an error still on screen.
function hint(t){if(!$('#message').style.color)$('#message').textContent=t}
// `saved` is the pilot on disk; checkboxes only change `selected` until "Guardar".
let saved=new Set();
function unsaved(){return selected.size!==saved.size||[...selected].some(id=>!saved.has(id))}
function count(){ $('#selected').textContent=`${selected.size}/50 cartas seleccionadas`+(unsaved()?' · cambios sin guardar':' · guardado'); $('#selected').style.color=unsaved()?'#ffb86b':''; }
function problem(t){message(t);$('#message').style.color='#ff8f8f';$('#message').scrollIntoView({behavior:'smooth',block:'center'})}
async function summary(){const s=await api('/api/summary');token=s.token;$('#summary').textContent=`${s.cards.toLocaleString()} identidades · ${s.references.toLocaleString()} imágenes · ${Object.values(s.reviews).reduce((a,b)=>a+b,0)} revisiones`;saved=new Set(s.pilot.map(c=>c.card_id));selected=new Set(saved);count()}
window.addEventListener('beforeunload',e=>{if(unsaved()){e.preventDefault();e.returnValue=''}});
function imageTile(ref){const box=node('article',undefined,'tile'),img=node('img');img.src=asset(ref.ref_id,true);img.loading='lazy';img.alt=ref.name;box.append(img,node('h3',ref.name),node('div',labels[ref.effective_status]||ref.effective_status,'tag'),node('p',`${ref.source} · ${ref.width} × ${ref.height} · ${ref.kind}`,'muted'));const b=node('button','Revisar');b.onclick=()=>openReview(ref);box.append(b);const a=node('a','Original');a.href=asset(ref.ref_id);a.target='_blank';a.rel='noopener';box.append(a);return box}
function cardTile(c){const box=node('article',undefined,'tile');if(c.cover){const img=node('img');img.src=asset(c.cover,true);img.alt=c.name_es||c.name_en;img.loading='lazy';box.append(img)}box.append(node('h3',c.name_es||c.name_en),node('p',c.name_en,'muted'));const b=node('button','Ver artes');b.onclick=()=>detail(c.id);const label=node('label'),check=node('input');check.type='checkbox';check.checked=selected.has(c.id);const blocked=c.pilot_eligible===false;check.disabled=blocked&&!check.checked;check.onchange=()=>{if(check.checked&&selected.size>=50){check.checked=false;problem('El piloto admite hasta 50 cartas; desmarca otra primero.');return}check.checked?selected.add(c.id):selected.delete(c.id);check.disabled=blocked&&!check.checked;count()};label.append(check,document.createTextNode(blocked?' Piloto · sin imagen enlazada, no se puede usar':' Piloto'));if(blocked)label.title='El piloto necesita una imagen de la carta enlazada o aprobada de al menos 200 × 290 px. Revísala en "Ver artes".';box.append(b,label);return box}
async function load(){try{message('Cargando…');$('#grid').replaceChildren();if(mode==='pilot'){const ids=[...selected];const cards=await Promise.all(ids.slice(page*30,page*30+30).map(id=>api('/api/card?id='+encodeURIComponent(id))));total=ids.length;cards.forEach(c=>{$('#grid').append(cardTile({...c,cover:c.refs.find(r=>r.kind==='card'&&['linked','approved'].includes(r.effective_status))?.ref_id}))})}else{const data=await api(mode==='pending'?`/api/pending?page=${page}`:`/api/cards?q=${encodeURIComponent($('#query').value)}&page=${page}`);total=data.total;data.items.forEach(c=>$('#grid').append(mode==='pending'?imageTile(c):cardTile(c)))}const size=mode==='pending'?24:30;$('#page').textContent=`Página ${page+1} · ${total} resultados`;$('#prev').disabled=page===0;$('#next').disabled=(page+1)*size>=total;hint(mode==='pending'?'Las propuestas no se usan en el piloto hasta que se aprueban.':'Selecciona una carta para revisar sus variantes.')}catch(e){problem(e.message)}}
async function detail(id){try{activeCard=id;const c=await api('/api/card?id='+encodeURIComponent(id)),section=$('#detail');section.hidden=false;section.replaceChildren(node('h2',c.name_es||c.name_en));for(const lang of ['es','en','de','fr','pt']){const t=c.texts[lang];section.append(node('p',`${lang.toUpperCase()}: ${t?.name||'Sin traducción disponible'}`))}const text=node('details');text.append(node('summary','Texto del catálogo'),node('p',c.texts.es?.effect||c.texts.en?.effect||'Sin texto'));section.append(text,node('p','La identidad puede estar enlazada aunque todavía no se haya verificado el arte, idioma impreso o acabado.'));const grid=node('div',undefined,'grid');c.refs.forEach(r=>grid.append(imageTile(r)));section.append(grid);section.scrollIntoView({behavior:'smooth'})}catch(e){message(e.message)}}
async function identitySearch(){const data=await api('/api/cards?q='+encodeURIComponent($('#identityQuery').value));$('#identity').replaceChildren();data.items.forEach(c=>{const o=node('option',c.name_es||c.name_en);o.value=c.id;$('#identity').append(o)})}
async function openReview(ref){activeRef=ref;$('#reviewImage').src=asset(ref.ref_id);$('#reviewName').textContent=ref.name;$('#identity').replaceChildren();$('#identityQuery').value=ref.name.replace(/\.(jpg|png)$/i,'').replace(/\s*\(\d+\)$/,'');$('#art').value=ref.effective_artwork_id||'';$('#language').value=ref.printed_language||'';$('#rarity').value=ref.reviewed_rarity||'';$('#note').value=ref.review_note||'';$('#reviewError').textContent='';$('#review').showModal();try{if(ref.effective_card_id){const c=await api('/api/card?id='+encodeURIComponent(ref.effective_card_id));const o=node('option',c.name_es||c.name_en);o.value=c.id;$('#identity').append(o)}else await identitySearch()}catch(e){$('#reviewError').textContent=e.message}}
async function saveReview(action){try{await api('/api/review',{ref_id:activeRef.ref_id,action,card_id:$('#identity').value,artwork_id:$('#art').value,language:$('#language').value,rarity:$('#rarity').value,note:$('#note').value});$('#review').close();await load();if(activeCard)await detail(activeCard);message('Revisión guardada. Regenera el piloto para incorporar cambios.')}catch(e){$('#reviewError').textContent=e.message}}
$('#reviewForm').onsubmit=e=>{e.preventDefault();saveReview('approve')};$('#reject').onclick=()=>saveReview('reject');$('#reset').onclick=()=>saveReview('reset');$('#cancel').onclick=()=>$('#review').close();$('#identitySearch').onclick=()=>identitySearch().catch(e=>$('#reviewError').textContent=e.message);
$('#search').onclick=()=>{mode='cards';page=0;load()};$('#query').onkeydown=e=>{if(e.key==='Enter')$('#search').click()};$('#pending').onclick=()=>{mode='pending';page=0;load()};$('#showPilot').onclick=()=>{mode='pilot';page=0;load()};$('#prev').onclick=()=>{page--;load()};$('#next').onclick=()=>{page++;load()};$('#savePilot').onclick=async()=>{if(!selected.size){problem('No se guardó: marca al menos una carta (el piloto admite de 1 a 50).');return}try{const r=await api('/api/pilot',{ids:[...selected]});
  // Show what was actually written, not what the page believes.
  saved=new Set(r.selection.map(c=>c.card_id));selected=new Set(saved);count();$('#message').style.color='';await load();
  message(`Piloto guardado: ${r.cards} cartas y ${r.references} referencias. Los visores abiertos lo cargan solos en el siguiente análisis (reconstruyen su índice en unos segundos).`)}catch(e){problem(e.message)}};
$('#clearPilot').onclick=async()=>{selected.clear();count();const note='Selección vacía. Marca las cartas que quieras y pulsa "Guardar selección del piloto"; nada cambia hasta guardar.';message(note);await load();
  // load() writes its own hint when it ends; restore ours unless something newer (an error) replaced it meanwhile.
  if(!$('#message').style.color)message(note)};
summary().then(load).catch(e=>message(e.message));
</script></html>
