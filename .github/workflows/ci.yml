# Comprobaciones en cada push a main y en cada pull request. Sólo corre lo que
# no necesita data/, downloads/, pesos ONNX ni un navegador: ver docs/CI.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Misma versión que .venv-eval del proyecto (Python 3.14.x, Windows); los pins
          # de requirements*.txt ya se probaron con ella.
          python-version: "3.14"
          cache: pip
      - name: Dependencias mínimas de las pruebas sin datos
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.5.3 opencv-python-headless==5.0.0.93 onnxruntime==1.30.0 Pillow==12.3.0 rapidfuzz==3.14.6
      - name: Compilación de todos los módulos
        run: python -m compileall -q .
      - name: Pruebas que corren sin datos ni modelos
        env:
          PYTHONUTF8: "1"
        run: python run_qa.py --ci   # the list lives in run_qa.CI
